<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>By Abaya - Tableau de bord</title>
  
  <!-- Poppins Font for exact mockup match -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#e8e9eb',
              white: '#ffffff',
              green: '#b2ea70',
              greenDark: '#2d4a0b',
              text: '#1f2937',
              grayLight: '#f3f4f6',
              grayText: '#8ca3af',
              red: '#ff6b6b',
              orange: '#ffa94d'
            }
          },
          borderRadius: {
            '4xl': '32px',
            '3xl': '24px'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #e8e9eb;
      color: #1f2937;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Hide scrollbar but keep functionality */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    /* Mockup-style Cards */
    .mockup-card {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      padding: 24px;
    }

    .green-card {
      background: #b2ea70;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(178, 234, 112, 0.2);
    }

    /* Donut Chart Base */
    .donut-chart {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .donut-chart::before {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* Modal Animation */
    #orderModal {
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #orderModal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #orderModal:not(.hidden) {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #modalContent {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(100%);
    }
    #orderModal:not(.hidden) #modalContent {
      transform: translateY(0);
    }

    /* Big Inputs for Mom */
    .input-mom {
      width: 100%;
      height: 60px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .input-mom:focus {
      outline: none;
      border-color: #b2ea70;
      background: #ffffff;
    }

    /* Tab styles */
    .tab-btn {
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background-color: #1f2937;
      color: white;
    }
    .tab-btn:not(.active) {
      background-color: transparent;
      color: #6b7280;
    }
    
    .view-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .view-section.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="antialiased p-4 md:p-8 min-h-screen flex justify-center">

  <div class="w-full max-w-lg md:max-w-4xl relative pb-20">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <img src="https://ui-avatars.com/api/?name=Safia&background=b2ea70&color=2d4a0b" alt="Profile" class="w-14 h-14 rounded-full shadow-sm border-2 border-white">
        <div>
          <h1 class="text-2xl font-semibold leading-tight tracking-tight">Bonjour, <span class="font-bold">Safia</span> 👋</h1>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-sm text-gray-500 hover:text-gray-900 transition-colors relative">
          <i class="ph-bold ph-bell text-xl"></i>
          <span class="absolute top-2 right-2 w-4 h-4 bg-app-text text-white text-[9px] font-bold rounded-full flex items-center justify-center border-2 border-white" id="notifBadge">0</span>
        </button>
      </div>
    </header>

    <!-- Tabs Navigation -->
    <nav class="flex gap-2 bg-white p-2 rounded-[28px] shadow-sm mb-6 w-full">
      <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn active flex-1 py-3 px-4 rounded-[20px] text-sm font-bold flex justify-center items-center gap-2">
        <i class="ph-fill ph-squares-four text-lg"></i> Accueil
      </button>
      <button onclick="switchTab('orders')" id="tab-orders" class="tab-btn flex-1 py-3 px-4 rounded-[20px] text-sm font-bold flex justify-center items-center gap-2">
        <i class="ph-fill ph-receipt text-lg"></i> Commandes
      </button>
      <button onclick="switchTab('customers')" id="tab-customers" class="tab-btn flex-1 py-3 px-4 rounded-[20px] text-sm font-bold flex justify-center items-center gap-2">
        <i class="ph-fill ph-users text-lg"></i> Clients
      </button>
    </nav>

    <!-- MASSIVE ADD BUTTON (Always visible at the top of content) -->
    <button onclick="toggleModal('orderModal', true)" class="w-full bg-app-greenDark text-app-green p-5 rounded-[28px] shadow-lg mb-6 flex justify-between items-center active:scale-95 transition-transform">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-app-green/20 rounded-full flex items-center justify-center">
          <i class="ph-bold ph-plus text-2xl text-app-green"></i>
        </div>
        <div class="text-left">
          <h2 class="text-xl font-bold">Ajouter une commande</h2>
          <p class="text-app-green/70 text-sm font-medium">Nouveau client ou article</p>
        </div>
      </div>
      <i class="ph-bold ph-caret-right text-xl"></i>
    </button>

    <!-- ========================================== -->
    <!-- VIEW: OVERVIEW -->
    <!-- ========================================== -->
    <div id="view-overview" class="view-section active space-y-6">
      
      <!-- Total Revenue -->
      <div class="mockup-card relative overflow-hidden">
        <!-- Decoration -->
        <svg class="absolute -right-6 -top-6 w-32 h-32 text-gray-50 opacity-50" viewBox="0 0 100 100" fill="currentColor">
          <circle cx="50" cy="50" r="50"/>
        </svg>
        
        <div class="flex justify-between items-start mb-4 relative z-10">
          <p class="text-sm font-bold text-gray-400">Chiffre d'Affaires</p>
          <div class="px-3 py-1 bg-green-50 text-green-600 rounded-full text-xs font-bold flex items-center gap-1">
            <i class="ph-bold ph-trend-up"></i> MAD
          </div>
        </div>
        <div class="relative z-10">
          <h2 class="text-4xl font-bold tracking-tight text-gray-900 mb-2" id="totalRevenueText">0 DH</h2>
          <p class="text-sm font-medium text-gray-500"><span id="totalOrdersCount" class="font-bold text-app-greenDark">0</span> commandes confirmées</p>
        </div>
      </div>

      <!-- Quick Stats Grid -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-white p-5 rounded-[28px] shadow-sm flex flex-col justify-center">
          <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3">
            <i class="ph-bold ph-check-circle text-xl"></i>
          </div>
          <p class="text-2xl font-bold text-gray-900" id="statLivraison">0%</p>
          <p class="text-xs font-semibold text-gray-500">Taux de livraison</p>
        </div>
        <div class="bg-white p-5 rounded-[28px] shadow-sm flex flex-col justify-center">
          <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mb-3">
            <i class="ph-bold ph-clock text-xl"></i>
          </div>
          <p class="text-2xl font-bold text-gray-900" id="statEnCours">0</p>
          <p class="text-xs font-semibold text-gray-500">En cours</p>
        </div>
      </div>

      <!-- Order Status (Donut Chart) -->
      <div class="mockup-card flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-6">
          <h3 class="font-bold text-gray-900">Statut Global</h3>
        </div>
        
        <div id="statusDonut" class="donut-chart mb-6 shadow-inner" style="background: conic-gradient(#b2ea70 0%, #b2ea70 0%);">
          <div class="absolute flex flex-col items-center z-10">
            <span class="text-3xl font-bold text-gray-900" id="donutTotal">0</span>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Total</span>
          </div>
        </div>
        
        <div class="w-full space-y-3 bg-gray-50 p-4 rounded-[20px]">
          <div class="flex justify-between items-center text-sm font-semibold">
            <span class="text-gray-600 flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-app-green shadow-sm"></div> Livrée</span>
            <span class="text-gray-900" id="legendLivree">0</span>
          </div>
          <div class="flex justify-between items-center text-sm font-semibold">
            <span class="text-gray-600 flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-app-orange shadow-sm"></div> En Cours</span>
            <span class="text-gray-900" id="legendEnCours">0</span>
          </div>
          <div class="flex justify-between items-center text-sm font-semibold">
            <span class="text-gray-600 flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-app-red shadow-sm"></div> Annulé/Retour</span>
            <span class="text-gray-900" id="legendAnnule">0</span>
          </div>
        </div>
      </div>

      <!-- Top Cities (Bars) -->
      <div class="mockup-card">
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-bold text-gray-900">Top Villes</h3>
          <i class="ph-bold ph-map-pin text-gray-400 text-xl"></i>
        </div>
        <div id="citiesChart" class="space-y-4">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Recent 5 Orders List -->
      <div class="mockup-card">
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-bold text-gray-900">Dernières commandes</h3>
          <button onclick="switchTab('orders')" class="text-app-greenDark font-bold text-sm bg-app-green/20 px-3 py-1 rounded-full">Voir tout</button>
        </div>
        <div class="space-y-3" id="recentOrdersList">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>


    <!-- ========================================== -->
    <!-- VIEW: ORDERS -->
    <!-- ========================================== -->
    <div id="view-orders" class="view-section">
      <!-- Search Bar -->
      <div class="relative mb-6">
        <i class="ph-bold ph-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xl"></i>
        <input type="text" id="search-orders" placeholder="Rechercher par nom, tel ou ville..." oninput="renderOrdersList()" class="w-full h-14 pl-12 pr-4 rounded-3xl border-2 border-white bg-white shadow-sm font-medium text-gray-900 focus:outline-none focus:border-app-green transition-colors">
      </div>

      <!-- Orders Container -->
      <div id="allOrdersContainer" class="space-y-3">
        <!-- Populated by JS -->
      </div>
    </div>


    <!-- ========================================== -->
    <!-- VIEW: CUSTOMERS -->
    <!-- ========================================== -->
    <div id="view-customers" class="view-section">
      <div class="bg-app-greenDark text-white p-6 rounded-[32px] mb-6 relative overflow-hidden">

          <path d="M50 0L57.9 35.8L93.3 25L68.3 50L93.3 75L57.9 64.2L50 100L42.1 64.2L6.7 75L31.7 50L6.7 25L42.1 35.8L50 0Z" />

        <p class="text-app-green text-sm font-medium mt-1 relative z-10">Classés par dépenses totales</p>
      </div>
      
      <!-- Customers Container -->
      <div id="customersContainer" class="space-y-3">
        <!-- Populated by JS -->
      </div>
    </div>

  </div> <!-- End Main Container -->


  <!-- ========================================== -->
  <!-- MODAL: ADD ORDER -->
  <!-- ========================================== -->
  <div id="orderModal" class="fixed inset-0 z-50 hidden flex flex-col justify-end md:justify-center md:items-center">
    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="toggleModal('orderModal', false)"></div>
    
    <div id="modalContent" class="bg-white w-full md:max-w-lg md:rounded-[32px] rounded-t-[32px] h-[90vh] md:h-auto overflow-hidden flex flex-col shadow-2xl relative z-10">
      
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-20 shrink-0">
        <div>
          <h2 class="text-2xl font-bold">Nouvelle Commande</h2>
          <p class="text-gray-500 text-sm font-medium">Remplissez les détails</p>
        </div>
        <button class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200 active:scale-90 transition-all" onclick="toggleModal('orderModal', false)">
          <i class="ph-bold ph-x text-xl"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto flex-1 bg-gray-50">
        <form id="addOrderForm" class="space-y-5">
          <div>
            <label class="block font-bold text-gray-700 ml-1 mb-2">Nom de la cliente</label>
            <input type="text" id="f_nom" required class="input-mom" placeholder="Ex: Fatima Zahra">
          </div>
          <div>
            <label class="block font-bold text-gray-700 ml-1 mb-2">Numéro de Téléphone</label>
            <input type="tel" id="f_tel" required class="input-mom" placeholder="06 00 00 00 00">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-gray-700 ml-1 mb-2">Ville</label>
              <input type="text" id="f_ville" required class="input-mom" placeholder="Ex: Casablanca">
            </div>
            <div>
              <label class="block font-bold text-gray-700 ml-1 mb-2">Taille</label>
              <select id="f_taille" required class="input-mom">
                <option value="Standard">Standard</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block font-bold text-gray-700 ml-1 mb-2">Nom de l'abaya</label>
            <input type="text" id="f_produit" required class="input-mom" placeholder="Ex: Abaya Zoom Noir">
          </div>
          <div>
            <label class="block font-bold text-gray-700 ml-1 mb-2">Prix (DH)</label>
            <input type="number" id="f_prix" required class="input-mom text-app-greenDark font-bold text-xl" placeholder="350">
          </div>
          <div>
            <label class="block font-bold text-gray-700 ml-1 mb-2">Statut</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
              <label class="relative">
                <input type="radio" name="f_statut" value="livree" class="peer sr-only">
                <div class="p-3 bg-white border-2 border-gray-200 rounded-xl text-center cursor-pointer font-bold text-[11px] text-gray-400 peer-checked:border-app-green peer-checked:bg-green-50 peer-checked:text-app-greenDark transition-all">
                  Livrée
                </div>
              </label>
              <label class="relative">
                <input type="radio" name="f_statut" value="en_cours" checked class="peer sr-only">
                <div class="p-3 bg-white border-2 border-gray-200 rounded-xl text-center cursor-pointer font-bold text-[11px] text-gray-400 peer-checked:border-orange-400 peer-checked:bg-orange-50 peer-checked:text-orange-700 transition-all">
                  En Cours
                </div>
              </label>
              <label class="relative">
                <input type="radio" name="f_statut" value="annulee" class="peer sr-only">
                <div class="p-3 bg-white border-2 border-gray-200 rounded-xl text-center cursor-pointer font-bold text-[11px] text-gray-400 peer-checked:border-red-400 peer-checked:bg-red-50 peer-checked:text-red-700 transition-all">
                  Annulée
                </div>
              </label>
              <label class="relative">
                <input type="radio" name="f_statut" value="retournee" class="peer sr-only">
                <div class="p-3 bg-white border-2 border-gray-200 rounded-xl text-center cursor-pointer font-bold text-[11px] text-gray-400 peer-checked:border-gray-400 peer-checked:bg-gray-100 peer-checked:text-gray-700 transition-all">
                  Retournée
                </div>
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="p-6 bg-white border-t border-gray-100 shrink-0">
        <button type="button" onclick="submitOrder()" class="w-full h-16 bg-app-green text-app-greenDark font-bold text-xl rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-transform shadow-lg shadow-app-green/30">
          <i class="ph-bold ph-check-circle text-2xl"></i> Enregistrer
        </button>
      </div>
    </div>
  </div>

    let orders = [];

    // --- 2. INITIALIZATION & LOGIC ---
    function init() {
      // Check if data is already initialized in localStorage
      const savedOrders = localStorage.getItem('byAbayaOrders');
      if (savedOrders) {
        orders = JSON.parse(savedOrders);
      } else {
        // First load: Parse the raw array
        orders = initialRawData.map(arr => {
          let v = (arr[3] || "Inconnu").toLowerCase();
          v = v.charAt(0).toUpperCase() + v.slice(1);
          return {
            id: arr[0],
            nom: arr[1],
            tel: arr[2],
            ville: v,
            prix: Number(arr[4]),
            statut: arr[5], // 'en_cours', 'livree', 'annulee', 'retournee'
            produit: arr[6],
            date: arr[7]
          };
        });
        saveOrders();
      }
      
      document.getElementById('notifBadge').textContent = orders.filter(o => o.statut === 'en_cours').length;
      renderAll();
    }

    function saveOrders() {
      localStorage.setItem('byAbayaOrders', JSON.stringify(orders));
    }

    // TAB SWITCHING
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`view-${tabId}`).classList.add('active');
    }

    // CENTRAL RENDERER
    function renderAll() {
      renderOverview();
      renderOrdersList();
      renderCustomers();
    }

    // VUE D'ENSEMBLE
    function renderOverview() {
      let totalRev = 0, countLivree = 0, countEnCours = 0, countAnnulee = 0, countRetournee = 0;
      let citiesMap = {};

      orders.forEach(o => {
        if (o.statut === 'livree') {
          totalRev += o.prix;
          countLivree++;
        } else if (o.statut === 'en_cours') {
          countEnCours++;
        } else if (o.statut === 'annulee') {
          countAnnulee++;
        } else if (o.statut === 'retournee') {
          countRetournee++;
        }

        citiesMap[o.ville] = (citiesMap[o.ville] || 0) + 1;
      });

      const totalOrders = orders.length;
      const tauxLivraison = totalOrders > 0 ? Math.round((countLivree / totalOrders) * 100) : 0;

      // Texts
      document.getElementById('totalOrdersCount').textContent = totalOrders;
      document.getElementById('totalRevenueText').textContent = totalRev.toLocaleString('fr-MA') + " DH";
      document.getElementById('statLivraison').textContent = tauxLivraison + "%";
      document.getElementById('statEnCours').textContent = countEnCours;
      document.getElementById('donutTotal').textContent = totalOrders;
      document.getElementById('legendLivree').textContent = countLivree;
      document.getElementById('legendEnCours').textContent = countEnCours;
      document.getElementById('legendAnnule').textContent = countAnnulee + countRetournee;

      // Donut (Calculate degrees)
      const pLiv = Math.round((countLivree / totalOrders) * 100) || 0;
      const pEnc = Math.round((countEnCours / totalOrders) * 100) || 0;
      const c1 = pLiv; 
      const c2 = pLiv + pEnc; 
      document.getElementById('statusDonut').style.background = 
        `conic-gradient(#b2ea70 0% ${c1}%, #ffa94d ${c1}% ${c2}%, #ff6b6b ${c2}% 100%)`;

      // Top Cities (Top 3 as requested)
      const sortedCities = Object.entries(citiesMap).sort((a,b) => b[1] - a[1]).slice(0, 3);
      const maxCity = sortedCities.length > 0 ? sortedCities[0][1] : 1;
      const citiesContainer = document.getElementById('citiesChart');
      citiesContainer.innerHTML = '';
      sortedCities.forEach(([city, count]) => {
        const w = Math.max(8, (count / maxCity) * 100);
        citiesContainer.innerHTML += `
          <div>
            <div class="flex justify-between text-xs font-bold text-gray-700 mb-1">
              <span>${city}</span><span>${count}</span>
            </div>
            <div class="h-2.5 w-full bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full bg-green-500 rounded-full" style="width: ${w}%"></div>
            </div>
          </div>
        `;
      });

      // Recent 5
      const recentContainer = document.getElementById('recentOrdersList');
      recentContainer.innerHTML = '';
      const recent = [...orders].reverse().slice(0, 5);
      recent.forEach(o => {
        let badge = getStatusBadge(o.statut);
        recentContainer.innerHTML += `
          <div class="bg-gray-50 p-3 rounded-[20px] flex items-center justify-between">
            <div>
              <p class="font-bold text-gray-900 text-sm leading-tight line-clamp-1">${o.nom}</p>
              <p class="text-[11px] font-medium text-gray-500">${o.ville} • ${o.date}</p>
            </div>
            <div class="text-right flex flex-col items-end gap-1 shrink-0">
              <p class="font-bold text-app-greenDark text-sm">${o.prix} DH</p>
              ${badge}
            </div>
          </div>
        `;
      });
    }

    // EDIT STATUS FUNCTION
    window.updateOrderStatus = function(orderId, newStatus) {
      const order = orders.find(o => o.id === orderId);
      if(order) {
        order.statut = newStatus;
        saveOrders();
        
        // Update Notif Badge
        document.getElementById('notifBadge').textContent = orders.filter(o => o.statut === 'en_cours').length;
        
        // Re-render everything to update colors and stats dynamically
        renderAll();
      }
    };

    // COMMANDES (Searchable List)
    function renderOrdersList() {
      const q = document.getElementById('search-orders').value.toLowerCase();
      const container = document.getElementById('allOrdersContainer');
      container.innerHTML = '';

      const filtered = orders.slice().reverse().filter(o => 
        o.nom.toLowerCase().includes(q) || 
        o.tel.toLowerCase().includes(q) ||
        o.ville.toLowerCase().includes(q)
      );

      if(filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 font-medium py-10">Aucune commande trouvée.</p>`;
        return;
      }

      filtered.forEach(o => {
        let selectColor = "bg-gray-100 text-gray-700";
        if (o.statut === 'livree') selectColor = "bg-green-100 text-green-700";
        else if (o.statut === 'en_cours') selectColor = "bg-orange-100 text-orange-700";
        else if (o.statut === 'annulee') selectColor = "bg-red-100 text-red-700";
        else if (o.statut === 'retournee') selectColor = "bg-gray-200 text-gray-600";

        container.innerHTML += `
          <div class="bg-white p-4 rounded-[24px] shadow-sm">
             <div class="flex justify-between items-start mb-3">
                <div class="pr-2">
                   <h4 class="font-bold text-gray-900 text-lg leading-tight capitalize">${o.nom}</h4>
                   <p class="text-xs font-semibold text-gray-400 mt-0.5"><i class="ph-fill ph-phone"></i> ${o.tel}</p>
                </div>
                <select onchange="updateOrderStatus('${o.id}', this.value)" class="${selectColor} text-[11px] px-2 py-1 rounded-xl font-bold border-none outline-none appearance-none cursor-pointer">
                  <option value="en_cours" ${o.statut === 'en_cours' ? 'selected' : ''}>En cours</option>
                  <option value="livree" ${o.statut === 'livree' ? 'selected' : ''}>Livrée</option>
                  <option value="annulee" ${o.statut === 'annulee' ? 'selected' : ''}>Annulée</option>
                  <option value="retournee" ${o.statut === 'retournee' ? 'selected' : ''}>Retournée</option>
                </select>
             </div>
             <div class="flex justify-between items-end border-t border-gray-50 pt-3">
                <div>
                  <p class="text-xs font-bold text-gray-800 line-clamp-1">${o.produit} <span class="text-gray-400 font-medium ml-1">(${o.taille || '-'})</span></p>
                  <p class="text-[11px] font-semibold text-gray-500">${o.ville}</p>
                </div>
                <p class="font-black text-app-greenDark text-lg shrink-0 pl-3">${o.prix} DH</p>
             </div>
          </div>
        `;
      });
    }

    // CLIENTS (Group by Phone)
    function renderCustomers() {
      const clientsObj = {};
      orders.forEach(o => {
        if(!clientsObj[o.tel]) {
          clientsObj[o.tel] = { nom: o.nom, tel: o.tel, totalSpent: 0, orderCount: 0 };
        }
        if(o.statut === 'livree') {
          clientsObj[o.tel].totalSpent += o.prix;
        }
        clientsObj[o.tel].orderCount++;
      });

      const sortedClients = Object.values(clientsObj).sort((a,b) => b.totalSpent - a.totalSpent);
      const container = document.getElementById('customersContainer');
      container.innerHTML = '';

      sortedClients.forEach((c, idx) => {
        // Initials logic
        let initials = "C";
        if(c.nom) {
          const parts = c.nom.trim().split(' ');
          initials = parts[0].charAt(0).toUpperCase();
          if(parts.length > 1) initials += parts[1].charAt(0).toUpperCase();
        }

        let medal = '';
        if(idx === 0) medal = '🥇';
        else if(idx === 1) medal = '🥈';
        else if(idx === 2) medal = '🥉';

        container.innerHTML += `
          <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between">
             <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-app-bg rounded-full flex items-center justify-center font-black text-gray-400 text-lg relative">
                  ${initials}
                  ${medal ? `<span class="absolute -top-1 -right-1 text-sm">${medal}</span>` : ''}
                </div>
                <div>
                   <h4 class="font-bold text-gray-900 capitalize">${c.nom}</h4>
                   <p class="text-xs font-semibold text-gray-400">${c.tel}</p>
                </div>
             </div>
             <div class="text-right">
                <p class="font-black text-app-greenDark text-lg">${c.totalSpent.toLocaleString('fr-MA')} DH</p>
                <p class="text-[11px] font-bold text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full inline-block mt-1">${c.orderCount} cmd(s)</p>
             </div>
          </div>
        `;
      });
    }

    // HELPERS
    function getStatusBadge(st) {
      if(st === 'livree') return `<span class="bg-green-100 text-green-700 text-[10px] px-2.5 py-1 rounded-full font-bold">Livrée</span>`;
      if(st === 'en_cours') return `<span class="bg-orange-100 text-orange-700 text-[10px] px-2.5 py-1 rounded-full font-bold">En cours</span>`;
      if(st === 'annulee') return `<span class="bg-red-100 text-red-600 text-[10px] px-2.5 py-1 rounded-full font-bold">Annulée</span>`;
      return `<span class="bg-gray-200 text-gray-600 text-[10px] px-2.5 py-1 rounded-full font-bold">Retournée</span>`;
    }

    function toggleModal(id, show) {
      const modal = document.getElementById(id);
      if(show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    // ADD NEW ORDER SUBMISSION
    function submitOrder() {
      const form = document.getElementById('addOrderForm');
      if(!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      
      const selectedStatus = document.querySelector('input[name="f_statut"]:checked').value;

      const newOrder = {
        id: "ORD-" + Math.floor(Math.random() * 100000),
        nom: document.getElementById('f_nom').value,
        tel: document.getElementById('f_tel').value,
        ville: document.getElementById('f_ville').value,
        produit: document.getElementById('f_produit').value,
        taille: document.getElementById('f_taille').value,
        prix: Number(document.getElementById('f_prix').value),
        statut: selectedStatus,
        date: `${dd}/${mm}`
      };

      // Ensure city is capitalized for normalization
      newOrder.ville = newOrder.ville.charAt(0).toUpperCase() + newOrder.ville.slice(1).toLowerCase();

      orders.push(newOrder); 
      saveOrders();
      renderAll();
      
      // Update Notif Badge
      document.getElementById('notifBadge').textContent = orders.filter(o => o.statut === 'en_cours').length;
      
      form.reset();
      toggleModal('orderModal', false);
      
      // Auto-switch to orders tab so she sees it was added
      switchTab('orders');
    }

    // Start App
    window.addEventListener('DOMContentLoaded', init);
  </script>
